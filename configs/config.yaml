project_title: "Nature-Inspired Augmentation Selection for Cyber Banking Data Awareness using Genetic Optimization and Low-Resource NLP"
experiment_name: "experiment_001"

runtime:
  mode: "simulation"
  baseline_modes: ["no_aug", "random", "fixed_bt", "fixed_bert", "rule_based", "ga_only", "gwo_only", "hybrid"]
  chunk_size: 32
  total_samples: 320
  faci_threshold: 0.5
  random_seed: 42

paths:
  data_dir: "./data"
  src_dir: "./src"
  models_dir: "./models"
  outputs_dir: "./outputs"
  results_dir: "./results"
  visualizations_dir: "./visualizations"
  checkpoints_dir: "./checkpoints"

logging:
  level: "INFO"
  log_to_file: True


genetic_algorithm:
  population_size: 10
  generations: 3
  crossover_rate: 0.8
  mutation_rate: 0.1
  elite_size: 2

grey_wolf_optimization:
  num_wolves: 5
  max_iter: 5
  a_decay_start: 2.0
  a_decay_end: 0.0

fitness_weights:
  classification_improvement: 0.4
  semantic_preservation: 0.2
  entity_preservation: 0.2
  diversity: 0.1
  cost_penalty: 0.1

bounds:
  # Order: BT_Ratio, BERT_Ratio, AugmentationBudget, MaskProbability, SemanticThreshold, EntityProtectionWeight, ChunkPriority, LearningRate
  bt_ratio: [0.0, 1.0]
  bert_ratio: [0.0, 1.0]
  budget: [1.0, 5.0]
  mask_prob: [0.05, 0.3]
  semantic_threshold: [0.7, 0.95]
  entity_weight: [0.5, 1.0]
  chunk_priority: [0.0, 1.0]
  learning_rate: [0.00001, 0.00005]
